# Ansible managed: Do NOT edit this file manually!

[[inputs.cpu]]
  collect_cpu_time = true
  percpu = false

[[inputs.disk]]
  ignore_fs = ["tmpfs","devtmpfs","devfs","iso9660","overlay","aufs","squashfs"]

[[inputs.diskio]]

[[inputs.haproxy]]
  servers = ["/run/haproxy/admin.sock"]

[[inputs.http]]
  data_format = "json_v2"
  name_override = "api_status"
  tagexclude = ["host"]
  urls = ["https://api.example.com/status","https://api2.example.com/status"]

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.postgresql]]
  address = "host=db1.example.com port=5432"
  databases = ["app_db"]

[[inputs.postgresql]]
  address = "host=db2.example.com port=5432"
  databases = ["metrics_db"]

[[inputs.swap]]

[[inputs.system]]

