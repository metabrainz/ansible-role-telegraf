  collect_cpu_time = true
  percpu = true
  report_active = false
  totalcpu = true

[[inputs.disk]]
  ignore_fs = ["tmpfs","devtmpfs","devfs","iso9660","overlay","aufs","squashfs"]

[[inputs.diskio]]

[[inputs.haproxy]]
  servers = ["/run/haproxy/admin.sock"]

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.postgresql]]
  address = "host=db1.example.com port=5432"
  databases = ["app_db"]

[[inputs.postgresql]]
  address = "host=db2.example.com port=5432"
  databases = ["metrics_db"]

[[inputs.swap]]

[[inputs.system]]

