---
telegraf_agent_interval: 30s

telegraf_group_inputs:
  cpu:
    collect_cpu_time: true
    percpu: false
  filestat:
    files:
      - "/var/log/**.log"
  haproxy:
    servers:
      - "/run/haproxy/admin.sock"
  http:
    - data_format: "json_v2"
      name_override: "api_status"
      tagexclude:
        - "host"
      urls:
        - "https://api.example.com/status"
        - "https://api2.example.com/status"
  processes:
    _enabled: "{{ inventory_hostname == 'instance' }}"
  postgresql:
    - address: "host=db1.example.com port=5432"
      databases:
        - "app_db"
    - address: "host=db2.example.com port=5432"
      databases:
        - "metrics_db"

telegraf_processors:
  regex:
    namepass:
      - "net"
    tag1:
      _name: tags
      key: "interface"
      pattern: "^enp2s0$"
      replacement: "eth0"
    tag2:
      _name: tags
      key: "interface"
      pattern: "^ens1$"
      replacement: "eth1"

telegraf_group_sudo_commands:
  - /usr/bin/cat /foo
