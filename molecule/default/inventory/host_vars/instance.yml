---
telegraf_agent_hostname: ansible_telegraf

telegraf_host_tags:
  datacentre: example

telegraf_outputs:
  influxdb:
    urls:
      - "http://stats.example.local:8086"
    database: "telegraf"
    retention_policy: ""
    write_consistency: "any"
    timeout: "5s"

telegraf_host_inputs:
  cpu:
    totalcpu: true
    percpu: true
  filestat:
    _enabled: "{{ inventory_hostname != 'instance' }}"

telegraf_host_processors:
  regex:
    namepass:
      - "net"
    tag1:
      _name: tags
      key: "interface"
      pattern: "^eno1$"
      replacement: "eth0"
  # Test 3-level nesting
  test_processor:
    level1:
      _name: nested1
      option1: "value1"
      level2:
        _name: nested2
        option2: "value2"
        level3:
          _name: nested3
          option3: "value3"

telegraf_sudo_defaults: "!logfile, !syslog, !pam_session"
telegraf_sudo_commands:
  - /usr/bin/ls /
