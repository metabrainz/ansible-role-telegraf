---
- name: Remove all possible conflicting repository files and keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/telegraf.list          # Old repo file
    - /etc/apt/sources.list.d/influxdata.list        # The file causing the current conflict
    - /etc/apt/trusted.gpg.d/telegraf.gpg            # Legacy key
    - /etc/apt/trusted.gpg.d/telegraf.asc            # Legacy key
    - /usr/share/keyrings/telegraf.asc               # Legacy key
    - /usr/share/keyrings/influxdata-archive.gpg     # The GPG version causing the mismatch
    - /usr/share/keyrings/influxdata-archive.asc     # ASC version

- name: Install Influx Data repository key
  ansible.builtin.shell: |
    wget -qO- "{{ telegraf_signing_key_url }}" | gpg --dearmor -o "{{ telegraf_signing_key_path }}"
  args:
    creates: "{{ telegraf_signing_key_path }}"

- name: Set correct permissions on GPG key
  ansible.builtin.file:
    path: "{{ telegraf_signing_key_path }}"
    mode: "0644"
    owner: root
    group: root

- name: Install Influx Data repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ telegraf_signing_key_path }}] https://repos.influxdata.com/debian stable main"
    filename: influxdata
    state: present
    update_cache: yes

- name: Install Telegraf
  ansible.builtin.apt:
    name: "telegraf{% if telegraf_version is defined %}={{ telegraf_version }}{% endif %}"
    state: present
    policy_rc_d: 101
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install Telegraf configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/{{ item }}"
    mode: "0644"
  with_items:
    - etc/telegraf/telegraf.conf
    - etc/telegraf/telegraf.d/ansible-inputs.conf
    - etc/telegraf/telegraf.d/ansible-processors.conf
  notify: restart telegraf
  vars:
    _telegraf_outputs: >-
      {{ telegraf_outputs | combine(
        telegraf_group_outputs, telegraf_host_outputs, recursive=True) }}
    _telegraf_inputs: >-
      {{ telegraf_inputs | combine(
        telegraf_group_inputs, telegraf_host_inputs, recursive=True) }}
    _telegraf_processors: >-
      {{ telegraf_processors | combine(
        telegraf_group_processors, telegraf_host_processors, recursive=True) }}
    _telegraf_tags: >-
      {{ telegraf_tags | combine(telegraf_group_tags, telegraf_host_tags) }}

- name: Add telegraf user to required groups
  ansible.builtin.user:
    name: telegraf
    groups: "{{ item }}"
    append: true
  # groups may not exist yet ¯\_(ツ)_/¯
  ignore_errors: true # noqa ignore-errors
  when:
    - item in _telegraf_inputs
    - _telegraf_inputs[item]._enabled | d(True)
  loop:
    - docker
    - haproxy
  notify: restart telegraf
  vars:
    _telegraf_inputs: >-
      {{ telegraf_inputs | combine(telegraf_group_inputs, telegraf_host_inputs) }}

- name: Install telegraf sudo rules
  ansible.builtin.template:
    src: etc/sudoers.d/ansible-telegraf.j2
    dest: /etc/sudoers.d/ansible-telegraf
    mode: "0640"
    validate: visudo -c -f %s
  vars:
    _telegraf_sudo_commands: >-
      {{ telegraf_sudo_commands + telegraf_group_sudo_commands +
        telegraf_host_sudo_commands }}

- name: Validate Telegraf configuration
  ansible.builtin.command: telegraf --test --config /etc/telegraf/telegraf.conf --config-directory /etc/telegraf/telegraf.d
  changed_when: false
  register: telegraf_test
  failed_when:
    - telegraf_test.rc != 0
    - "'error parsing' in telegraf_test.stderr or 'Error loading config' in telegraf_test.stderr"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Show Telegraf validation output on failure
  ansible.builtin.debug:
    var: telegraf_test
  when: telegraf_test.rc != 0

- name: Enable and start Telegraf
  ansible.builtin.service:
    name: telegraf
    enabled: "{{ telegraf_service_enabled }}"
    state: "{{ telegraf_service_state }}"
  ignore_errors: "{{ ansible_check_mode }}"
