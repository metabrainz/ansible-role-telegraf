---
- name: Assert no telegraf_group_<section> collision on multi-group hosts
  # A plain `telegraf_group_<section>` cannot merge across groups: if two of this
  # host's groups both set it, Ansible silently keeps only one BEFORE this role
  # runs. We cannot see the dropped value, but we CAN see the tell-tale mixed
  # usage (plain var + a per-group `__<group>` var for the same section) and fail
  # early with a fix hint, instead of shipping a config that silently lost inputs.
  ansible.builtin.assert:
    that:
      - _telegraf_colliding_sections | length == 0
    fail_msg: >-
      Telegraf config collision on host '{{ inventory_hostname }}' for section(s):
      {{ _telegraf_colliding_sections | join(', ') }}.
      This host is in multiple groups and mixes the plain `telegraf_group_<section>`
      var with per-group `telegraf_group_<section>__<group>` vars for the same
      section. The plain var is resolved from only ONE group by Ansible, so another
      group's contribution may have been silently dropped (e.g. missing postgresql
      inputs). Fix: rename the plain var in each group_vars file to the per-group
      form by appending the group name, e.g. in group_vars/<group>.yml change
      `telegraf_group_{{ _telegraf_collision_example }}:` to
      `telegraf_group_{{ _telegraf_collision_example }}__<group>:`
      (for instance `telegraf_group_{{ _telegraf_collision_example }}__pg_servers:`).
      The role then merges every group's per-group vars across all of the host's groups.
    success_msg: "No telegraf_group_<section> collisions detected on '{{ inventory_hostname }}'."
  tags:
    - telegraf
    - telegraf-assert

- name: Remove legacy/conflicting repository files and keys
  # Only removes *legacy* artefacts from older key/repo layouts. The current
  # repo file (influxdata) and key ({{ telegraf_signing_key_path }}) are managed
  # idempotently by the download/dearmor/apt_repository tasks below, so they must
  # NOT be listed here (doing so re-deletes+recreates them on every run).
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/telegraf.list          # Old repo file
    - /etc/apt/trusted.gpg.d/telegraf.gpg            # Legacy key
    - /etc/apt/trusted.gpg.d/telegraf.asc            # Legacy key
    - /usr/share/keyrings/telegraf.asc               # Legacy key

- name: Download Influx Data repository key
  ansible.builtin.get_url:
    url: "{{ telegraf_signing_key_url }}"
    dest: "{{ telegraf_signing_key_path }}.asc"
    mode: "0644"

- name: Dearmor Influx Data repository key
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ telegraf_signing_key_path }} {{ telegraf_signing_key_path }}.asc"
    creates: "{{ telegraf_signing_key_path }}"

- name: Set correct permissions on GPG key
  ansible.builtin.file:
    path: "{{ telegraf_signing_key_path }}"
    mode: "0644"
    owner: root
    group: root

- name: Install Influx Data repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ telegraf_signing_key_path }}] https://repos.influxdata.com/debian stable main"
    filename: influxdata
    state: present
    update_cache: true

- name: Install Telegraf
  ansible.builtin.apt:
    name: "telegraf{% if telegraf_version is defined %}={{ telegraf_version }}{% endif %}"
    state: present
    policy_rc_d: 101
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install Telegraf configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/{{ item }}"
    mode: "0644"
  with_items:
    - etc/telegraf/telegraf.conf
    - etc/telegraf/telegraf.d/ansible-inputs.conf
    - etc/telegraf/telegraf.d/ansible-processors.conf
  notify: restart telegraf
  vars:
    _telegraf_outputs: "{{ _telegraf_outputs_merged }}"
    _telegraf_inputs: "{{ _telegraf_inputs_merged }}"
    _telegraf_processors: "{{ _telegraf_processors_merged }}"
    _telegraf_tags: "{{ _telegraf_tags_merged }}"

- name: Add telegraf user to required groups
  ansible.builtin.user:
    name: telegraf
    groups: "{{ item }}"
    append: true
  # groups may not exist yet ¯\_(ツ)_/¯
  ignore_errors: true # noqa ignore-errors
  when:
    - item in _telegraf_inputs
    - _telegraf_inputs[item]._enabled | d(True)
  loop:
    - docker
    - haproxy
  notify: restart telegraf
  vars:
    _telegraf_inputs: "{{ _telegraf_inputs_merged }}"

- name: Install telegraf sudo rules
  ansible.builtin.template:
    src: etc/sudoers.d/ansible-telegraf.j2
    dest: /etc/sudoers.d/ansible-telegraf
    mode: "0640"
    validate: visudo -c -f %s
  vars:
    _telegraf_sudo_commands: "{{ _telegraf_sudo_commands_merged }}"

- name: Validate Telegraf configuration
  ansible.builtin.command: telegraf --test --config /etc/telegraf/telegraf.conf --config-directory /etc/telegraf/telegraf.d
  changed_when: false
  register: telegraf_test
  failed_when:
    - telegraf_test.rc != 0
    - "'error parsing' in telegraf_test.stderr or 'Error loading config' in telegraf_test.stderr"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Show Telegraf validation output on failure
  ansible.builtin.debug:
    var: telegraf_test
  when: telegraf_test.rc != 0

- name: Enable and start Telegraf
  ansible.builtin.service:
    name: telegraf
    enabled: "{{ telegraf_service_enabled }}"
    state: "{{ telegraf_service_state }}"
  ignore_errors: "{{ ansible_check_mode }}"
