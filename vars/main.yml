---
telegraf_user: telegraf

# --- Multi-group section merge -------------------------------------------------
#
# Ansible resolves a single `telegraf_group_<section>` var from only ONE group per
# host (hash-replace, not merge), so a host in two groups that both set it silently
# loses one group's config. To support multi-group hosts, a group may instead
# define a per-group variable:
#     telegraf_group_<section>__<group_name>
#     e.g.  telegraf_group_inputs__gw_servers, telegraf_group_inputs__consul_agents
# The role folds these across ALL of the host's group_names. The legacy single
# `telegraf_group_<section>` vars are still merged first, so existing inventories
# keep working. Precedence (last wins): base -> legacy group -> per-group -> host.
#
# Note: the per-group list is wrapped as [legacy] + <per-group> + [host] before
# splatting into combine(), so the argument list is never empty (combine(*[]) is a
# Jinja syntax error).

# Per-group override dicts contributed by every group this host belongs to.
_telegraf_pg_inputs: >-
  {{ group_names | map('regex_replace', '^(.+)$', 'telegraf_group_inputs__\1')
     | map('extract', hostvars[inventory_hostname]) | select('defined') | list }}
_telegraf_pg_outputs: >-
  {{ group_names | map('regex_replace', '^(.+)$', 'telegraf_group_outputs__\1')
     | map('extract', hostvars[inventory_hostname]) | select('defined') | list }}
_telegraf_pg_processors: >-
  {{ group_names | map('regex_replace', '^(.+)$', 'telegraf_group_processors__\1')
     | map('extract', hostvars[inventory_hostname]) | select('defined') | list }}
_telegraf_pg_tags: >-
  {{ group_names | map('regex_replace', '^(.+)$', 'telegraf_group_tags__\1')
     | map('extract', hostvars[inventory_hostname]) | select('defined') | list }}
_telegraf_pg_sudo_commands: >-
  {{ group_names | map('regex_replace', '^(.+)$', 'telegraf_group_sudo_commands__\1')
     | map('extract', hostvars[inventory_hostname]) | select('defined') | list }}

# Merged results consumed by tasks/main.yml (dict sections: recursive combine;
# sudo_commands: list concatenation).
_telegraf_inputs_merged: >-
  {{ telegraf_inputs
     | combine(*([telegraf_group_inputs] + _telegraf_pg_inputs + [telegraf_host_inputs]),
               recursive=True) }}
_telegraf_outputs_merged: >-
  {{ telegraf_outputs
     | combine(*([telegraf_group_outputs] + _telegraf_pg_outputs + [telegraf_host_outputs]),
               recursive=True) }}
_telegraf_processors_merged: >-
  {{ telegraf_processors
     | combine(*([telegraf_group_processors] + _telegraf_pg_processors + [telegraf_host_processors]),
               recursive=True) }}
_telegraf_tags_merged: >-
  {{ telegraf_tags
     | combine(*([telegraf_group_tags] + _telegraf_pg_tags + [telegraf_host_tags])) }}
_telegraf_sudo_commands_merged: >-
  {{ telegraf_sudo_commands + telegraf_group_sudo_commands
     + (_telegraf_pg_sudo_commands | sum(start=[])) + telegraf_host_sudo_commands }}

# --- Collision detection -------------------------------------------------------
#
# The plain `telegraf_group_<section>` var cannot be merged across groups by
# Ansible: if two of a host's groups both set it, one is silently dropped BEFORE
# this role runs, so the loss is not detectable at runtime. What IS detectable is
# the *mixed* usage that signals the risk: a host has a non-empty plain
# `telegraf_group_<section>` AND at least one per-group `telegraf_group_<section>__<group>`
# for the same section. That means more than one source is contributing to that
# section on this host, and the plain one is exactly the fragile part (its
# defining group may have lost the hash-replace race). We fail with a hint to
# migrate the plain var to the per-group `__<group>` suffix.
#
# Sections checked (dict sections only; sudo_commands is list-concatenated and
# never collides).
_telegraf_collision_sections:
  inputs: >-
    {{ ((telegraf_group_inputs | default({}) | length > 0)
       and (_telegraf_pg_inputs | length > 0)) | bool }}
  outputs: >-
    {{ ((telegraf_group_outputs | default({}) | length > 0)
       and (_telegraf_pg_outputs | length > 0)) | bool }}
  processors: >-
    {{ ((telegraf_group_processors | default({}) | length > 0)
       and (_telegraf_pg_processors | length > 0)) | bool }}
  tags: >-
    {{ ((telegraf_group_tags | default({}) | length > 0)
       and (_telegraf_pg_tags | length > 0)) | bool }}

# List of section names that are in the risky mixed state on this host.
# Each map value renders as the string "True"/"False", so we cast with `| bool`
# per item (a bare non-empty "False" string would otherwise be truthy) and keep
# the keys whose cast value is true.
_telegraf_colliding_sections: >-
  {{ _telegraf_collision_sections | dict2items
     | selectattr('value', 'match', '^True$')
     | map(attribute='key') | list }}

# A representative section name for the fail hint. Length-guarded so it never
# calls `first` on an empty list (which raises during eager fail_msg templating).
_telegraf_collision_example: >-
  {{ (_telegraf_colliding_sections | first)
     if (_telegraf_colliding_sections | length > 0) else 'inputs' }}
